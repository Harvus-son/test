<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Отметь настроение в Moodly"><title>Настроение — Moodly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head>
<body data-page="mood"><header class="site-header"><a class="logo" href="index.html"><span>◒</span> moodly</a><nav><a href="index.html">Главная</a><a class="active" href="mood.html">Настроение</a><a href="diary.html">Дневник</a><a href="insights.html">Инсайты</a></nav><button class="icon-btn" id="themeToggle">☼</button></header>
<main class="container narrow"><section class="page-head"><p class="eyebrow">Check-in / 01</p><h1>Что ты сейчас<br><span>чувствуешь?</span></h1><p>Выбери то, что ближе всего. Здесь нет правильного ответа.</p></section>
<section class="mood-picker"><div class="mood-options" id="moodOptions"><button data-mood="Радость" data-icon="☀">☀<span>Радость</span></button><button data-mood="Спокойствие" data-icon="◌">◌<span>Спокойствие</span></button><button data-mood="Энергия" data-icon="↗">↗<span>Энергия</span></button><button data-mood="Грусть" data-icon="☾">☾<span>Грусть</span></button><button data-mood="Тревога" data-icon="≈">≈<span>Тревога</span></button><button data-mood="Усталость" data-icon="—">—<span>Усталость</span></button></div>
<div class="intensity"><div class="row-between"><label for="intensity">Интенсивность</label><strong><span id="intensityValue">5</span>/10</strong></div><input id="intensity" type="range" min="1" max="10" value="5"></div>
<div class="note-box"><label for="note">Что повлияло на состояние?</label><textarea id="note" rows="5" maxlength="280" placeholder="Например: хорошо выспался, много работы, встретился с друзьями..."></textarea><small><span id="charCount">0</span>/280</small></div>
<button class="btn primary full" id="saveMood">Сохранить check-in</button><p class="form-message" id="formMessage" aria-live="polite"></p></section></main><footer class="container footer"><span>moodly / check-in</span><a href="diary.html">Перейти к дневнику →</a></footer><script src="assets/js/app.js"></script></body></html>
